<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b27"><meta name="description" content="Wordgrove — a relaxing dictionary-based word puzzle game."><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg"><title>Wordgrove</title><style>
:root{--bg:#102b27;--panel:#183a34;--panel2:#21483f;--gold:#f3c66a;--cream:#fff7e6;--muted:#b7c9bc;--green:#a8d5a2;--shadow:0 12px 35px #06171366}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% -10%,#315c4d 0%,var(--bg) 56%);color:var(--cream);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;display:flex;justify-content:center}.app{width:min(100%,520px);min-height:100dvh;padding:env(safe-area-inset-top) 18px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:15px 2px 12px}.brand{display:flex;align-items:center;gap:10px;font-weight:900;letter-spacing:.4px;font-size:20px}.leaf{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#d9e9a8,#82b987);display:grid;place-items:center;color:#174333;font-size:20px;box-shadow:0 4px 12px #06171355}.iconbtn{border:1px solid #ffffff25;background:#ffffff0b;color:var(--cream);border-radius:13px;width:42px;height:42px;font-size:19px}.levelbar{display:flex;align-items:center;justify-content:space-between;margin:8px 0 16px;color:var(--muted);font-size:13px}.levelname{color:var(--gold);font-weight:800;font-size:14px;letter-spacing:1.2px;text-transform:uppercase}.progress{height:6px;background:#ffffff17;border-radius:8px;overflow:hidden;margin-top:8px}.progress>i{display:block;height:100%;background:linear-gradient(90deg,#8dc99a,var(--gold));width:0%;transition:width .25s}.board{background:linear-gradient(145deg,#1b4038,#17352f);border:1px solid #ffffff12;border-radius:25px;padding:18px 14px;box-shadow:var(--shadow);min-height:225px;display:flex;flex-direction:column;justify-content:center;gap:12px}.wordrow{display:flex;justify-content:center;gap:5px;min-height:38px}.cell{width:clamp(25px,7vw,35px);height:36px;border-bottom:2px solid #719184;background:#ffffff09;border-radius:6px 6px 3px 3px;display:grid;place-items:center;font-weight:900;font-size:18px;color:var(--cream);text-transform:uppercase}.wordrow.solved .cell{background:#416d56;border-color:#a8d5a2;color:#fff}.wordrow.solved{animation:pop .25s ease}.wordrow .cell.filled{border-color:var(--gold);color:var(--gold)}@keyframes pop{50%{transform:scale(1.025)}}.status{height:28px;text-align:center;color:var(--gold);font-size:13px;font-weight:700;padding-top:7px}.playarea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:320px}.wheel{position:relative;width:min(78vw,310px);height:min(78vw,310px);max-height:310px;max-width:310px;margin:10px auto 6px;border-radius:50%;background:radial-gradient(circle,#285447 0%,#1a3c34 64%,#16352e 65%);border:1px solid #ffffff17;box-shadow:inset 0 0 35px #071d18aa,0 10px 28px #06171355}.letter{position:absolute;left:50%;top:50%;width:57px;height:57px;transform:translate(-50%,-50%);border:0;border-radius:50%;background:linear-gradient(145deg,#fff4d8,#e7c987);color:#274438;font-size:25px;font-weight:900;box-shadow:0 5px 0 #a77c3f,0 8px 15px #06171355;touch-action:manipulation}.letter:active{transform:translate(-50%,-46%);box-shadow:0 2px 0 #a77c3f}.letter.used{opacity:.48}.current{height:32px;letter-spacing:8px;font-size:23px;font-weight:900;color:var(--gold);text-transform:uppercase}.actions{display:flex;align-items:center;justify-content:center;gap:12px;margin:12px 0 10px}.action{border:1px solid #ffffff24;background:#ffffff0b;color:var(--cream);border-radius:15px;padding:12px 17px;font-size:14px;font-weight:800}.action.primary{background:linear-gradient(135deg,#f5d58b,#dcae58);color:#263d31;border:0;box-shadow:0 4px 0 #a77c3f}.action:active{transform:translateY(1px)}.bottom{display:flex;justify-content:space-between;color:#8da99a;font-size:11px;padding:10px 4px 0}.toast{position:fixed;top:calc(env(safe-area-inset-top) + 70px);left:50%;transform:translate(-50%,-12px);background:#f3c66a;color:#213a2e;padding:11px 18px;border-radius:13px;font-weight:900;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow);white-space:nowrap;z-index:5}.toast.show{opacity:1;transform:translate(-50%,0)}.overlay{position:fixed;inset:0;background:#061713bb;display:none;align-items:center;justify-content:center;padding:22px;z-index:4}.overlay.show{display:flex}.modal{width:min(100%,390px);background:#1a3b33;border:1px solid #ffffff24;border-radius:24px;padding:25px;box-shadow:var(--shadow);text-align:center}.modal h2{margin:0 0 8px;color:var(--gold)}.modal p{color:var(--muted);line-height:1.5;font-size:14px}.modal .action{margin-top:10px}.stats{display:flex;justify-content:center;gap:28px;margin:18px 0}.stats strong{display:block;font-size:24px;color:var(--gold)}.stats span{font-size:11px;color:var(--muted)}
</style></head><body><main class="app"><header class="top"><div class="brand"><span class="leaf">✦</span> WORDGROVE</div><button class="iconbtn" id="help" aria-label="How to play">?</button></header><section><div class="levelbar"><span class="levelname" id="levelname">Meadow · 1</span><span id="count">0 / 0 words</span></div><div class="progress"><i id="progress"></i></div></section><section class="board" id="board" aria-label="Crossword word slots"></section><div class="status" id="status">Find every word using the letters below</div><section class="playarea"><div class="current" id="current"></div><div class="wheel" id="wheel" aria-label="Letter wheel"></div><div class="actions"><button class="action" id="shuffle">⤨ Shuffle</button><button class="action" id="clear">Clear</button><button class="action primary" id="enter">Enter</button></div></section><footer class="bottom"><span>✦ Dictionary word puzzles</span><span id="total">5,000 levels</span></footer></main><div class="toast" id="toast"></div><div class="overlay" id="overlay"><div class="modal" id="modal"></div></div><script src="app.js"></script></body></html>
