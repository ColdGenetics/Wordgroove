<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b27">
<meta name="description" content="Wordgrove — swipe letters, solve word puzzles, and grow your word skills.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>Wordgrove</title>
<style>
:root{--bg:#102b27;--panel:#183a34;--panel2:#21483f;--gold:#f3c66a;--cream:#fff7e6;--muted:#b7c9bc;--green:#a8d5a2;--line:#ffffff20;--shadow:0 12px 35px #06171366}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;margin:0;overflow:hidden}
body{background:radial-gradient(ellipse at 50% -10%,#315c4d 0%,var(--bg) 56%);color:var(--cream);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;overscroll-behavior:none}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.app{width:min(100%,520px);height:100dvh;height:100svh;margin:0 auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(env(safe-area-inset-bottom) + 8px);display:flex;flex-direction:column;overflow:hidden;gap:8px}
.top{height:46px;min-height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 2px}
.brand{display:flex;align-items:center;gap:9px;font-weight:950;letter-spacing:.8px;font-size:19px}
.leaf{width:34px;height:34px;border-radius:12px;background:linear-gradient(145deg,#d9e9a8,#82b987);display:grid;place-items:center;color:#174333;font-size:20px;box-shadow:0 4px 12px #06171355}
.iconbtn{border:1px solid var(--line);background:#ffffff0b;color:var(--cream);border-radius:13px;width:40px;height:40px;font-size:19px;display:grid;place-items:center}
.coin-pill{display:flex;align-items:center;gap:6px;background:#1a2e28e6;border:2px solid #f3c66a;color:#ffe9a8;border-radius:20px;padding:7px 12px;font-size:13px;font-weight:900;text-shadow:0 1px 0 #000c,0 0 6px #0008;box-shadow:0 0 0 1px #0006,0 4px 12px #0005}.coin-pill span{color:#ffe9a8;text-shadow:0 1px 0 #000d,0 0 4px #0009;-webkit-text-stroke:0.35px #2a1a00}.coin-icon{display:inline-grid;place-items:center;width:1.15em;height:1.15em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#e8b84a 55%,#b8860b);color:#5a3a00;font-size:0.95em;line-height:1;box-shadow:0 0 0 1.5px #5a3a00,0 1px 2px #0008;text-shadow:none;-webkit-text-stroke:0}
.home{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:6px 0}
.hero{background:linear-gradient(145deg,#1c443a,#17352f);border:1px solid var(--line);border-radius:28px;padding:25px 20px;box-shadow:var(--shadow);text-align:center}
.hero-kicker{color:var(--green);font-size:11px;font-weight:900;letter-spacing:2px;text-transform:uppercase}
.hero h1{font-size:clamp(32px,9vw,44px);line-height:1.05;margin:9px 0 7px;letter-spacing:-1px}
.hero p{color:var(--muted);font-size:14px;margin:0;line-height:1.45}
.home-stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stat-card{background:#ffffff0c;border:1px solid var(--line);border-radius:18px;padding:14px;text-align:center}
.stat-card strong{display:block;color:#ffe9a8;font-size:25px;line-height:1.1;text-shadow:0 1px 0 #000c,0 0 8px #0007;-webkit-text-stroke:0.3px #2a1a00}
.stat-card span{display:block;color:var(--muted);font-size:11px;margin-top:5px;letter-spacing:.7px;text-transform:uppercase}
.primary{background:linear-gradient(135deg,#f5d58b,#dcae58);color:#263d31;border:0;box-shadow:0 4px 0 #a77c3f}
.action{border:1px solid var(--line);background:#ffffff0b;color:var(--cream);border-radius:15px;padding:12px 10px;font-size:13px;font-weight:850;min-height:44px}
.play-btn{width:100%;border-radius:17px;padding:16px;font-size:17px;font-weight:950;letter-spacing:.3px}
.home-help{background:transparent;border:0;color:var(--muted);padding:8px;font-size:13px}
.game{flex:1;min-height:0;display:flex;flex-direction:column;gap:5px}
.game-head{display:flex;align-items:center;justify-content:space-between;min-height:38px}
.level-info{display:flex;flex-direction:column;gap:1px}
.levelname{color:var(--gold);font-weight:900;font-size:13px;letter-spacing:1.1px;text-transform:uppercase}
.level-sub{color:var(--muted);font-size:11px}
.progress{height:5px;background:#ffffff17;border-radius:8px;overflow:hidden;margin:3px 0 4px}
.progress>i{display:block;height:100%;background:linear-gradient(90deg,#8dc99a,var(--gold));width:0%;transition:width .25s}
.board{background:linear-gradient(145deg,#1b4038,#17352f);border:1px solid #ffffff12;border-radius:22px;padding:10px 8px;box-shadow:var(--shadow);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:minmax(27px,1fr);gap:5px 3px;align-content:center;min-height:95px;max-height:24dvh;overflow:hidden}
.wordrow{display:flex;justify-content:center;align-items:center;gap:3px;min-width:0}
.cell{width:clamp(17px,5.4vw,28px);height:clamp(25px,3.7dvh,32px);border-bottom:2px solid #719184;background:#ffffff09;border-radius:5px 5px 3px 3px;display:grid;place-items:center;font-weight:950;font-size:clamp(13px,4vw,17px);color:var(--cream);text-transform:uppercase;flex:0 1 auto}
.wordrow.solved .cell{background:#416d56;border-color:#a8d5a2;color:#fff}
.wordrow .cell.filled{border-color:var(--gold);color:var(--gold)}
.wordrow.long .cell{width:clamp(14px,4.2vw,23px);font-size:clamp(12px,3.4vw,15px);height:clamp(24px,3.5dvh,30px)}
.status{min-height:23px;height:23px;text-align:center;color:var(--gold);font-size:12px;font-weight:750;padding-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.current{height:27px;min-height:27px;letter-spacing:6px;font-size:21px;font-weight:950;color:var(--gold);text-transform:uppercase;text-align:center}
.wheel-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.wheel{position:relative;width:min(76vw,30dvh,278px);aspect-ratio:1;flex:none;border-radius:50%;background:radial-gradient(circle,#285447 0%,#1a3c34 64%,#16352e 65%);border:1px solid #ffffff17;box-shadow:inset 0 0 35px #071d18aa,0 10px 28px #06171355;touch-action:none;user-select:none}
.letter{position:absolute;left:50%;top:50%;width:clamp(48px,13vw,58px);height:clamp(48px,13vw,58px);transform:translate(-50%,-50%);border:0;border-radius:50%;background:linear-gradient(145deg,#fff4d8,#e7c987);color:#274438;font-size:24px;font-weight:950;box-shadow:0 4px 0 #a77c3f,0 8px 15px #06171355;touch-action:none;user-select:none;display:grid;place-items:center;padding:0}
.letter.selected{background:linear-gradient(145deg,#d9e9a8,#8fc69a);color:#17382d;box-shadow:0 4px 0 #507d59,0 8px 15px #06171355;transform:translate(-50%,-50%) scale(1.06)}
.actions{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:0 0 2px}
.actions .action{padding:9px 4px;font-size:12px;min-height:42px}
.bottom{display:flex;justify-content:space-between;color:#8da99a;font-size:10px;padding:1px 3px 0;min-height:14px}
.toast{position:fixed;top:calc(env(safe-area-inset-top) + 58px);left:50%;transform:translate(-50%,-12px);background:#f3c66a;color:#213a2e;padding:10px 15px;border-radius:13px;font-weight:900;font-size:13px;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow);white-space:nowrap;z-index:8;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{opacity:1;transform:translate(-50%,0)}
.overlay{position:fixed;inset:0;background:#061713c9;display:none;align-items:center;justify-content:center;padding:22px;z-index:7}
.overlay.show{display:flex}
.modal{width:min(100%,390px);background:#1a3b33;border:1px solid #ffffff24;border-radius:24px;padding:23px;box-shadow:var(--shadow);text-align:center}
.modal h2{margin:0 0 8px;color:var(--gold);font-size:25px}
.modal p{color:var(--muted);line-height:1.5;font-size:14px;margin:8px 0}
.modal .action{margin-top:10px;min-width:130px}
.modal .stats{display:flex;justify-content:center;gap:28px;margin:18px 0}
.modal .stats strong{display:block;font-size:24px;color:var(--gold)}
.modal .stats span{font-size:10px;color:var(--muted);letter-spacing:.5px}
@media(max-height:740px){.app{gap:5px;padding-top:calc(env(safe-area-inset-top) + 4px);padding-bottom:calc(env(safe-area-inset-bottom) + 4px)}.top{height:40px;min-height:40px}.leaf{width:30px;height:30px}.board{max-height:22dvh;padding:7px}.hero{padding:18px}.home{gap:11px}.wheel{width:min(70vw,27dvh,245px)}.current{height:23px;min-height:23px}.status{height:19px;min-height:19px}}

.audio-controls{display:flex;gap:5px;align-items:center}.audio-btn{width:auto;min-width:42px;padding:0 8px;font-size:10px;white-space:nowrap;color:var(--muted)}
.home-stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat-card{padding:12px 5px}.stat-card strong{font-size:22px}
.board.crossword{display:grid;grid-template-columns:repeat(var(--cw,7),minmax(0,1fr));grid-template-rows:repeat(var(--ch,7),minmax(0,1fr));gap:3px;padding:9px;min-height:110px;height:min(31dvh,290px);max-height:31dvh;align-content:stretch;justify-content:stretch;overflow:hidden;}
.cross-cell{min-width:0;min-height:0;border:1px solid #ffffff22;border-radius:5px;background:linear-gradient(145deg,#f1d89f,#d5b778);color:#203c30;font-size:clamp(11px,3.2vw,19px);font-weight:950;text-transform:uppercase;display:grid;place-items:center;padding:0;box-shadow:0 2px 0 #9f804a;touch-action:manipulation}
.cross-cell.cross-solved{background:linear-gradient(145deg,#9fcca0,#6eaa82);border-color:#d6f0ce;color:#12382d}
.cross-cell.cross-revealed{background:linear-gradient(145deg,#f4d78b,#e7b95f);border-color:#fff0bd;color:#3c351d}
.cross-cell.cross-selected{outline:2px solid var(--gold);outline-offset:1px;z-index:1}
.selected-clue{height:18px;min-height:18px;text-align:center;color:#d5dfc7;font-size:11px;font-weight:750;letter-spacing:.3px}
.actions{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:0 0 1px}.actions .action{min-height:37px;padding:7px 3px;font-size:11px}
.word-list{max-height:48vh;overflow:auto;text-align:left;margin:12px 0;padding-right:3px}.word-definition{display:flex;flex-direction:column;gap:3px;padding:10px 2px;border-bottom:1px solid #ffffff20}.word-definition strong{color:var(--gold);font-size:14px;letter-spacing:.7px}.word-definition span{font-size:12px;color:var(--cream);line-height:1.4}.modal-body{color:var(--cream);font-size:14px;line-height:1.5;margin:10px 0}.hint-options{display:grid;gap:8px}.hint-options .action{width:100%;text-align:left}
@media(max-height:740px){.board.crossword{height:26dvh;max-height:26dvh;min-height:90px;padding:6px;gap:2px}.cross-cell{font-size:clamp(10px,2.8vw,16px)}.selected-clue{height:16px;min-height:16px}.actions .action{min-height:34px}.audio-btn{font-size:9px;padding:0 5px}}


/* Wordgrove 3.1 — spacious, translucent meadow layout */
body.stage-field{background:linear-gradient(180deg,#e6c77d 0%,#9dbb72 35%,#477b55 100%)}
body.stage-moonlit-forest{background:linear-gradient(180deg,#182e4d 0%,#334f66 40%,#1c463f 100%)}
body.stage-waterfall{background:linear-gradient(180deg,#a7d8d8 0%,#6daeb0 38%,#2e6e70 100%)}
body.stage-autumn-grove{background:linear-gradient(180deg,#e4a56b 0%,#a95f45 42%,#4e4935 100%)}
body.stage-crystal-lake{background:linear-gradient(180deg,#9dcce2 0%,#639db9 42%,#315b72 100%)}
body.stage-misty-highlands{background:linear-gradient(180deg,#b4c2b4 0%,#708c80 45%,#344f4a 100%)}
body.stage-sunset-valley{background:linear-gradient(180deg,#e8a16e 0%,#b36d70 45%,#4a5360 100%)}

:root{--panel:#ffffff12;--panel2:#ffffff19;--line:#ffffff35;--shadow:0 12px 35px #06171335}

body.stage-meadow{background:linear-gradient(#102b2720,#102b2755),url('./meadow.svg') center/cover fixed}

body.stage-moonlit-forest{background:linear-gradient(#102b2730,#102b2766),url('./moonlit-forest.svg') center/cover fixed}
body.stage-waterfall{background:linear-gradient(#102b2720,#102b2755),url('./waterfall.svg') center/cover fixed}
body.stage-autumn-grove{background:linear-gradient(#102b2720,#102b2755),url('./autumn-grove.svg') center/cover fixed}

body.stage-misty-highlands{background:linear-gradient(#102b2720,#102b2755),url('./misty-highlands.svg') center/cover fixed}

body:before{content:none}
.app{gap:5px;padding-left:12px;padding-right:12px}
.top{height:34px;min-height:34px;justify-content:flex-end}
.brand,.audio-controls{display:none}
.home{gap:12px}
.hero,.stat-card,.action,.iconbtn,.coin-pill,.modal{background: #ffffff20;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-color:#ffffff38;box-shadow:0 8px 26px #123b2e25}
.hero{background:#ffffff20}
.game{gap:3px}
.game-head{min-height:34px}
.level-info{align-items:center;flex:1}
.levelname{color:#fff2c7;text-shadow:0 2px 9px #1b493b88}
.level-sub{color:#f0f4df}
.board.crossword{width:100%;height:auto;min-height:0;max-height:38dvh;aspect-ratio:var(--board-ratio,1);padding:0;gap:3px;background:transparent;border:0;border-radius:0;box-shadow:none;align-content:stretch;justify-content:center;overflow:visible;margin:0 auto}
.cross-cell{aspect-ratio:1;width:100%;height:100%;min-width:0;min-height:0;border-radius:5px;background:#fff0c9e8;border:1px solid #fff9df;box-shadow:0 2px 0 #8c7952aa;font-size:clamp(10px,3.1vw,17px)}
.cross-cell.cross-solved{background:#b9e2b7e8;border-color:#e8ffe2}
.cross-cell.cross-revealed{background:#f8d88feF;border-color:#fff2c2}
.selected-clue{height:15px;min-height:15px;color:#f4f5df}
.status{height:19px;min-height:19px;color:#fff0c6}
.current{height:23px;min-height:23px}
.wheel-wrap{flex:1;min-height:0;display:grid;grid-template-columns:minmax(48px,1fr) auto minmax(48px,1fr);align-items:center;justify-items:center;gap:5px}
.wheel{width:min(57vw,25dvh,220px);max-width:220px;background:radial-gradient(circle,#7cae83cc 0%,#3d785eaa 64%,#285b48aa 65%);border:1px solid #ffffff55;box-shadow:inset 0 0 30px #143f2c55,0 10px 24px #0d352b33;backdrop-filter:blur(8px)}
.letter{width:clamp(44px,11vw,54px);height:clamp(44px,11vw,54px);background:linear-gradient(145deg,#fff9e8,#e8d6a7);box-shadow:0 3px 0 #a98f5e,0 7px 14px #153e2c33}
.wheel-side{display:grid;gap:9px;width:100%;align-content:center}
.wheel-side .action{width:100%;min-width:0;padding:9px 3px;font-size:11px;min-height:42px;line-height:1.15}
.actions{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:7px;margin:0}
.actions .action{min-height:39px;font-size:12px}
#enter{grid-column:1/-1}
.bottom{display:none}
#homeBtn{width:36px;height:36px}
.menu-btn{width:36px;height:36px}
.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:58vh;overflow:auto;text-align:left;padding:2px}
.stage-card{border:1px solid #ffffff35;background:#ffffff13;color:var(--cream);border-radius:14px;padding:11px 9px;text-align:left;min-height:65px}
.stage-card strong{display:block;color:#fff0c6;font-size:13px}
.stage-card span{display:block;color:#e1e9d6;font-size:10px;margin-top:4px}
.stage-card:disabled{opacity:.38}
.menu-options{display:grid;gap:8px}
.menu-options .action{text-align:left;width:100%}
.reveal-pulse{animation:meadowReveal 1.2s ease-in-out infinite alternate}.stage-meadow .cross-cell.reveal-pulse{outline:1px solid #e8f5b6}
@keyframes meadowReveal{from{box-shadow:0 0 0 0 #e8f7a000;filter:brightness(1)}to{box-shadow:0 0 17px 5px #d8f5a9bb;filter:brightness(1.16)}}
@media(max-height:740px){.board.crossword{max-height:32dvh}.wheel{width:min(53vw,22dvh,195px)}.wheel-side .action{min-height:36px;padding:7px 2px}.actions .action{min-height:35px}}

#enter{grid-column:1/-1}
.bottom{display:none}
#homeBtn{width:36px;height:36px}
.menu-btn{width:36px;height:36px}
.stage-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;max-height:58vh;overflow:auto;text-align:left;padding:2px}
.stage-card{border:1px solid #ffffff35;background:#ffffff13;color:var(--cream);border-radius:14px;padding:11px 9px;text-align:left;min-height:65px}
.stage-card strong{display:block;color:#fff0c6;font-size:13px}
.stage-card span{display:block;color:#e1e9d6;font-size:10px;margin-top:4px}
.stage-card:disabled{opacity:.38}
.menu-options{display:grid;gap:8px}
.menu-options .action{text-align:left;width:100%}
.reveal-pulse{animation:meadowReveal 1.2s ease-in-out infinite alternate}.stage-meadow .cross-cell.reveal-pulse{outline:1px solid #e8f5b6}
@keyframes meadowReveal{from{box-shadow:0 0 0 0 #e8f7a000;filter:brightness(1)}to{box-shadow:0 0 17px 5px #d8f5a9bb;filter:brightness(1.16)}}
@media(max-height:740px){.board.crossword{max-height:32dvh}.wheel{width:min(53vw,22dvh,195px)}.wheel-side .action{min-height:36px;padding:7px 2px}.actions .action{min-height:35px}}


/* Wordgrove 3.2 — stable first-frame rendering and thumb-friendly layout */
body.in-game .top{display:none}
.game{display:flex;flex-direction:column;gap:4px;min-height:0}
.game-head{flex:0 0 38px;min-height:38px}
.board.crossword{flex:0 1 auto;align-self:center;max-height:36dvh;min-height:0;margin:auto auto 0;}
.cross-cell{font-size:clamp(15px,4.4vw,25px)!important;font-weight:1000!important;line-height:1}
.selected-clue{display:none!important}/* status kept visible for word progress */
.current{flex:0 0 30px;height:30px;min-height:30px;margin-top:auto;display:grid;place-items:center;font-size:clamp(20px,5.5vw,27px);letter-spacing:5px}
.wheel-wrap{flex:0 0 min(32dvh,260px);min-height:155px;display:flex;align-items:center;justify-content:center}
.wheel{width:min(64vw,28dvh,240px);max-width:240px;flex:none}
.actions{flex:0 0 auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:0 0 2px}
.actions .action{min-height:43px;padding:9px 5px;font-size:13px}
#enter{display:none!important}
@media(max-height:740px){.game-head{flex-basis:34px;min-height:34px}.board.crossword{max-height:32dvh}.current{flex-basis:25px;height:25px;min-height:25px}.wheel-wrap{flex-basis:24dvh;min-height:120px}.wheel{width:min(56vw,22dvh,190px)}.actions .action{min-height:36px;padding:7px 4px}}
@media(max-height:620px){.board.crossword{max-height:27dvh}.wheel-wrap{flex-basis:21dvh;min-height:100px}.wheel{width:min(48vw,19dvh,160px)}.actions .action{min-height:32px}}


/* 3.4-fixed: force first paint of board + wheel + cells */
#board.crossword{visibility:visible!important;opacity:1!important;display:grid!important}
#wheel{visibility:visible!important;opacity:1!important}
.letter{visibility:visible!important;opacity:1!important;color:#274438!important}
.cross-cell{visibility:visible!important;opacity:1!important;background:#fff0c9e8!important;color:#203c30!important;font-weight:1000!important}
.cross-cell.cross-solved{background:#b9e2b7e8!important}
.cross-cell.cross-revealed{background:#f8d88feF!important}
.status{display:block!important;visibility:visible!important;opacity:1!important;color:#fff0c6!important}
.level-finish{text-align:center;padding:5px 0}
.finish-leaf{font-size:34px;color:var(--gold);text-shadow:0 0 18px #e7f4b2aa}
.level-finish h2{margin:8px 0;color:#fff4cf}
.level-finish p{color:#e8efdf;font-size:13px;line-height:1.45}
.level-finish .stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:18px 0 10px}
.level-finish .stats>div{padding:14px 8px;border-radius:15px;background:#ffffff18;border:1px solid #ffffff30}
.level-finish .stats strong{display:block;font-size:25px;color:var(--gold)}
.level-finish .stats span{display:block;font-size:10px;letter-spacing:1px;font-weight:900;margin-top:4px}
.level-finish .finish-detail{font-size:11px;opacity:.85}
.level-finish #next{width:100%;margin-top:10px}
.app-version{margin-top:12px;text-align:center;font-size:10px;letter-spacing:.08em;color:#e8efdf;opacity:.48;font-weight:500}

.def-line{text-align:left;margin:8px 0;line-height:1.4;color:#e8efdf;font-size:13px}
.def-line strong{color:var(--gold);margin-right:6px}


.stage-summary{color:var(--muted);font-size:12px;line-height:1.4;margin:0 0 10px}
.level-list{display:grid;gap:6px;max-height:48vh;overflow:auto;margin:0 0 10px;padding-right:2px}
.level-row{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:1px solid #ffffff30;background:#ffffff12;color:var(--cream);border-radius:12px;padding:10px 11px;font-size:13px}
.level-row.current{border-color:#f3c66a88;background:#f3c66a18}
.level-row.done{border-color:#a8d5a255}
.level-row.locked{opacity:.42}
.level-row-num{font-weight:900;color:#fff0c6;min-width:2.6em}
.level-row-meta{flex:1;color:#e1e9d6;font-size:12px}
.level-row-tag{font-size:10px;font-weight:850;letter-spacing:.4px;text-transform:uppercase;color:var(--gold);background:#f3c66a22;border:1px solid #f3c66a55;border-radius:999px;padding:3px 8px}


/* Coin readability on every stage background */
.coin-pill{
  background:#1a2e28f2 !important;
  border:2px solid #f3c66a !important;
  color:#ffe9a8 !important;
  text-shadow:0 1px 0 #000c,0 0 6px #0008 !important;
  box-shadow:0 0 0 1px #0007,0 4px 12px #0006 !important;
  backdrop-filter:none !important;
  -webkit-backdrop-filter:none !important;
}
.coin-pill span{
  color:#ffe9a8 !important;
  text-shadow:0 1px 0 #000d,0 0 4px #0009 !important;
}
.coin-pill .coin-icon{
  color:#5a3a00 !important;
  text-shadow:none !important;
  -webkit-text-stroke:0 !important;
}
#homeCoins{
  color:#ffe9a8 !important;
  text-shadow:0 1px 0 #000c,0 0 8px #0007 !important;
}


.word-def-head{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.word-level-tag{font-size:10px;font-weight:850;letter-spacing:.4px;text-transform:uppercase;color:var(--gold);background:#f3c66a22;border:1px solid #f3c66a55;border-radius:999px;padding:3px 8px;white-space:nowrap}
.word-def-text{display:block;font-size:12px;color:var(--cream);line-height:1.4;margin-top:4px}
.word-definition.rich{padding:11px 4px}
.changelog{max-height:52vh;overflow:auto;text-align:left;padding-right:4px}
.change-block{margin:0 0 14px}
.change-block h3{margin:0 0 6px;color:#fff0c6;font-size:14px}
.change-block ul{margin:0;padding-left:1.15em;color:var(--cream);font-size:13px;line-height:1.45}
.change-block li{margin:0 0 4px}


.stat-btn{cursor:pointer;font:inherit;color:inherit;appearance:none}
.stat-btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<main class="app">
  <header class="top"><button class="iconbtn menu-btn" id="homeMenuBtn" aria-label="Open menu">☰</button></header>

  <section class="home" id="homeScreen">
    <div class="hero">
      <div class="hero-kicker">A little word adventure</div>
      <h1>Wordgrove</h1>
      <p>Swipe letters, discover words, and watch your vocabulary grow.</p>
    </div>
    <div class="app-version" id="homeVersion">Wordgrove v3.5.16</div>
    <div class="home-stats">
      <div class="stat-card"><strong id="homeLevel">1</strong><span>Current level</span></div>
      <div class="stat-card"><strong id="homeCoins">50</strong><span>Coins</span></div>
      <button type="button" class="stat-card stat-btn" id="homeWordsCard" title="View all words found"><strong id="homeWords">0</strong><span>Words found</span></button>
    </div>
    <button class="action primary play-btn" id="playBtn">▶ &nbsp; Play</button>
    <button class="action" id="levelsBtn">✧ &nbsp; Levels</button>
    <button class="action" id="globalWordsBtn">▤ &nbsp; Words found</button>
    <button class="home-help" id="homeHelp" title="Help">How to play · Coins · Hints</button>
  </section>

  <section class="game" id="gameScreen" hidden>
    <div class="game-head">
      <button class="iconbtn" id="gameMenuBtn" aria-label="Game menu">☰</button>
      <div class="level-info"><span class="levelname" id="levelname">Meadow · 1</span><span class="level-sub" id="levelsub">Find all the words</span></div>
      <div class="coin-pill"><span class="coin-icon" aria-hidden="true">●</span><span id="gameCoins">50</span></div>
    </div>
    <section class="board crossword" id="board" aria-label="Crossword puzzle"></section>
    <div class="selected-clue" id="selectedClue" aria-hidden="true"></div>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="current" id="current" aria-live="polite"></div>
    <div class="wheel-wrap">
      <div class="wheel" id="wheel" aria-label="Letter wheel"></div>
    </div>
    <div class="actions">
      <button class="action" id="wordListBtn">▤ Words</button>
      <button class="action" id="hint">✦ Hints</button>
      <button class="action" id="extrasBtn">✧ Bonus words</button>
      <button class="action" id="shuffle">⤨ Shuffle</button>
    </div>
  </section>
</main>
<div class="toast" id="toast"></div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<script src="app.js"></script>
</body>
</html>
